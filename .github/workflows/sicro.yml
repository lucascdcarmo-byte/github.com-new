name: SICRO
on:
  schedule:
    - cron: '17 9 5,20 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sicro.py', '.github/workflows/sicro.yml']
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 py7zr openpyxl
      - run: mkdir -p dados/sicro && python -u sicro.py 2>&1 | tee dados/sicro/log.txt
      - run: |
          git config user.name "caos-robo"
          git config user.email "caos-robo@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || (git commit -m "SICRO atualizado" && git push)
