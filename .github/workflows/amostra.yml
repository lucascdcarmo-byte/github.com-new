name: AMOSTRA
on:
  push:
    branches: [main]
    paths: ['amostra.py', '.github/workflows/amostra.yml']
permissions:
  contents: write
jobs:
  amostra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests py7zr openpyxl
      - run: python amostra.py
      - run: |
          git config user.name "caos-robo"
          git config user.email "caos-robo@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || (git commit -m "amostra analitico" && git pull --rebase && git push)
